name: CI

on:
  workflow_dispatch:
  pull_request:
    types: [synchronize, opened, reopened]
  push:
    branches: [main]
  schedule:
    # additionally run once per week (At 00:00 on Sunday) to maintain cache
    - cron: '0 0 * * 0'

permissions:
  contents: read

jobs:
  cabal:
    name: ${{ matrix.os }} / ghc ${{ matrix.ghc }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macOS-latest, windows-latest]
        cabal: ['latest']
        ghc:
          - '8.10.7'
          - '9.0.2'
          - '9.2.8'
          - '9.4.8'
          - '9.6.7'
          - '9.8.4'
          - '9.10.3'
          - '9.12.4'
          - '9.14.1'
        exclude:
          - os: macOS-latest
            ghc: 9.10.3
          - os: macOS-latest
            ghc: 9.8.4
          - os: macOS-latest
            ghc: 9.6.7
          - os: macOS-latest
            ghc: 9.4.8
          - os: macOS-latest
            ghc: 9.2.8
          - os: macOS-latest
            ghc: 9.0.2
          - os: macOS-latest
            ghc: 8.10.7

          - os: windows-latest
            ghc: 9.10.3
          - os: windows-latest
            ghc: 9.8.4
          - os: windows-latest
            ghc: 9.6.7
          - os: windows-latest
            ghc: 9.4.8
          - os: windows-latest
            ghc: 9.2.8
          - os: windows-latest
            ghc: 9.0.2
          - os: windows-latest
            ghc: 8.10.7

    steps:
    - uses: actions/checkout@v7

    - uses: haskell-actions/setup@v2.12.1
      id: setup-haskell-cabal
      name: Setup Haskell
      with:
        ghc-version: ${{ matrix.ghc }}
        cabal-version: ${{ matrix.cabal }}

    # Ubuntu 26.04 no longer ships ld.gold, but the hsc2hs wrapper of the
    # GHC 9.2/9.4 bindists hardcodes HSC2HS_EXTRA="--lflag=-fuse-ld=gold"
    # (the GHC settings file itself is fine), so every .hsc file fails with
    # "collect2: fatal error: cannot find 'ld'".
    - name: Set linker to ld.bfd for GHC 9.2/9.4 on Ubuntu
      if: runner.os == 'Linux' && (matrix.ghc == '9.2.8' || matrix.ghc == '9.4.8')
      run: |
        GHC_BIN_DIR="$(dirname "$(readlink -f "$(command -v ghc)")")"
        FILES="$(grep -lI -- '-fuse-ld=gold' "$GHC_BIN_DIR"/* "$(ghc --print-libdir)/settings" || true)"
        for f in $FILES; do
          sed -i --follow-symlinks 's/-fuse-ld=gold/-fuse-ld=bfd/g' "$f"
          echo "Patched $f:"
          grep -H -- '-fuse-ld' "$f"
        done

    - name: Configure
      run: |
        cabal configure --enable-tests --enable-benchmarks --enable-documentation --test-show-details=direct --write-ghc-environment-files=always -ftutorial

    - name: Freeze
      run: |
        cabal freeze

    - uses: actions/cache@v6
      name: Cache ~/.cabal/store
      with:
        path: ${{ steps.setup-haskell-cabal.outputs.cabal-store }}
        key: ${{ runner.os }}-${{ matrix.ghc }}-${{ hashFiles('cabal.project.freeze') }}

    - name: Install dependencies
      run: |
        cabal build all --only-dependencies

    - name: Build
      run: |
        cabal build all

    - name: Test
      run: |
        cabal test all

    - name: Documentation
      run: |
        cabal haddock
